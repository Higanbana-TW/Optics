<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免安裝的 A3/A4 滿版西門子星產生器">
  <title>西門子星產生器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
      color: #172033;
      background: #e9eef6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(300px, 420px) minmax(320px, 1fr);
      gap: 28px;
      padding: 32px;
    }
    .panel, .preview-panel {
      border: 1px solid #d7deea;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px #17203318;
    }
    .panel {
      align-self: center;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 34px); }
    .intro { margin: 0 0 28px; color: #5b687d; line-height: 1.65; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #b9c4d5;
      border-radius: 9px;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #225bd6;
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { background: #174ab8; }
    button:focus-visible, select:focus-visible {
      outline: 3px solid #76a0ff;
      outline-offset: 2px;
    }
    .note {
      margin: 18px 0 0;
      color: #68758a;
      font-size: 14px;
      line-height: 1.55;
    }
    .preview-panel {
      min-height: calc(100vh - 64px);
      padding: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    #preview {
      max-width: 100%;
      max-height: calc(100vh - 108px);
      display: grid;
      place-items: center;
      filter: drop-shadow(0 8px 18px #17203338);
    }
    #preview svg {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 108px);
      width: auto;
      height: auto;
      background: #fff;
    }
    @media (max-width: 780px) {
      body { grid-template-columns: 1fr; padding: 18px; }
      .panel { padding: 26px; }
      .preview-panel { min-height: 480px; }
      #preview, #preview svg { max-height: 440px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>西門子星產生器</h1>
    <p class="intro">
      完全在瀏覽器內產生滿版 DXF／SVG，不需安裝 Python 或任何程式。
    </p>

    <label for="angle">區隔角度</label>
    <select id="angle">
      <option value="2">2 度</option>
      <option value="5">5 度</option>
    </select>

    <label for="paper">紙張大小</label>
    <select id="paper">
      <option value="A4">A4（210 × 297 mm）</option>
      <option value="A3">A3（297 × 420 mm）</option>
    </select>

    <label for="orientation">紙張方向</label>
    <select id="orientation">
      <option value="portrait">直向</option>
      <option value="landscape">橫向</option>
    </select>

    <label for="file-format">下載格式</label>
    <select id="file-format">
      <option value="dxf">DXF（R12，毫米單位）</option>
      <option value="svg">SVG（向量圖片）</option>
    </select>

    <button id="download" type="button">下載 DXF 檔案</button>
    <p class="note">
      DXF 是 AutoCAD R12 格式，單位為毫米，可用 ZWCAD 與 LibreCAD 開啟。
      列印時請選擇「實際大小」或 100%，並關閉「符合頁面」。
    </p>
  </main>

  <section class="preview-panel" aria-label="西門子星預覽">
    <div id="preview"></div>
  </section>

  <script src="siemens_star.js"></script>
  <script>
    const angleSelect = document.querySelector("#angle");
    const paperSelect = document.querySelector("#paper");
    const orientationSelect = document.querySelector("#orientation");
    const formatSelect = document.querySelector("#file-format");
    const preview = document.querySelector("#preview");
    const downloadButton = document.querySelector("#download");

    function settings() {
      return pageSettings(
        angleSelect.value,
        paperSelect.value,
        orientationSelect.value
      );
    }

    function updatePreview() {
      preview.innerHTML = createSvg(settings());
    }

    function triggerDownload(content, mimeType, filename) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadFile() {
      const { paper, angle, orientation } = settings();
      const basename =
        `siemens_star_${paper.toLowerCase()}_${angle}deg_${orientation}`;
      if (formatSelect.value === "dxf") {
        triggerDownload(createDxf(settings()), "application/dxf", `${basename}.dxf`);
      } else {
        const svg = `<?xml version="1.0" encoding="UTF-8"?>\n${createSvg(settings())}`;
        triggerDownload(svg, "image/svg+xml;charset=utf-8", `${basename}.svg`);
      }
    }

    [angleSelect, paperSelect, orientationSelect].forEach(element => {
      element.addEventListener("change", updatePreview);
    });
    formatSelect.addEventListener("change", () => {
      const label = formatSelect.value === "dxf" ? "DXF 檔案" : "SVG 圖片";
      downloadButton.textContent = `下載 ${label}`;
    });
    downloadButton.addEventListener("click", downloadFile);
    updatePreview();
  </script>
</body>
</html>
